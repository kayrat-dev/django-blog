name: Django CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    name: Run Django Tests in Docker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
            cp .env.example mysite/.env
          else
            echo "SECRET_KEY=ci-secret-key-12345" > .env
            echo "DEBUG=True" >> .env
            echo "DATABASE_URL=postgres://postgres:postgres@db:5432/postgres" >> .env
          fi

      - name: Build and Start Containers
        run: docker compose up -d --build

      - name: Wait for Postgres
        run: sleep 5

      - name: Run Tests
        run: docker compose run --rm -e SECRET_KEY="django-insecure-ci-key-for-testing-only" web python mysite/manage.py test

      - name: Tear Down Docker
        if: always()
        run: docker compose down

  build-and-push-docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/django-blog:latest